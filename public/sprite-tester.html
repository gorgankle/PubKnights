<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pub Knights - Matrix Developer Tool</title>
    <style>
        body { 
            background-color: #2c2520; 
            color: #f4ebd9; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            padding: 40px; 
            margin: 0;
        }
        h1 { color: #ffcc66; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin-bottom: 20px;}
        
        .panel { 
            background: rgba(62, 49, 38, 0.90); 
            border: 2px solid #634e3d; 
            border-radius: 5px; 
            padding: 20px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
        }

        /* Blows up the canvas for pixel-perfect inspection */
        #tester-canvas {
            width: 256px;
            height: 256px;
            background-color: #1a1512;
            border: 4px solid #8b5a2b;
            border-radius: 4px;
            image-rendering: pixelated; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9);
        }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px;}
        
        button { 
            background: #8b5a2b; 
            color: white; 
            border: 1px solid #ffcc66; 
            padding: 10px; 
            font-family: monospace; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 3px; 
            font-size: 12px; 
            transition: 0.1s;
        }
        button:hover { background: #a06d3b; }
        button:active { transform: scale(0.95); }

        /* Dropdowns for Equipment */
        select.equip-drop {
            background: #1a1512; color: #ffcc66; border: 1px solid #634e3d;
            padding: 8px; font-family: monospace; border-radius: 3px;
            font-size: 11px; cursor: pointer; width: 100%;
        }
        select.equip-drop:focus { outline: none; border-color: #f1c40f; }
        
        /* New Open Listboxes for standalone assets */
        select.asset-listbox {
            background: #1a1512; color: #f4ebd9; border: 1px solid #634e3d;
            padding: 5px; font-family: monospace; border-radius: 3px;
            font-size: 12px; width: 100%; height: 250px; overflow-y: auto;
        }
        select.asset-listbox option { padding: 6px; border-bottom: 1px solid #2c2520; cursor: pointer; }
        select.asset-listbox option:checked { background: #8b5a2b; color: #ffffff; font-weight: bold; }
        select.asset-listbox:focus { outline: none; border-color: #f1c40f; }

        .section-title { color: #bbaaa0; font-size: 14px; text-transform: uppercase; margin: 0 0 15px 0; border-bottom: 1px dashed #634e3d; padding-bottom: 5px; text-align: left; }

        .side-study {
            max-width: 900px;
            margin: 0 auto 20px;
        }

        .side-study-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 230px;
            gap: 22px;
            align-items: start;
        }

        .side-study-stages {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .side-study-stage {
            min-width: 0;
        }

        .side-study-canvas-wrap {
            display: grid;
            place-items: center;
            aspect-ratio: 1;
            border: 1px solid #634e3d;
            border-radius: 4px;
            background: #1a1512;
        }

        .side-study-canvas {
            display: block;
            width: min(100%, 224px);
            height: auto;
            aspect-ratio: 1;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .side-study-stage-label {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 8px;
            color: #f4ebd9;
            font-size: 12px;
            text-align: left;
        }

        .side-study-stage-label span:last-child {
            color: #39b8ba;
        }

        .side-study-controls {
            display: grid;
            gap: 16px;
            text-align: left;
        }

        .study-control-label {
            display: block;
            margin-bottom: 7px;
            color: #bbaaa0;
            font-size: 11px;
            text-transform: uppercase;
        }

        .study-segment {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4px;
        }

        .study-segment.clips {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .study-segment button {
            min-width: 0;
            min-height: 36px;
            padding: 7px 4px;
            border-color: #634e3d;
            background: #1a1512;
        }

        .study-segment button[aria-pressed="true"] {
            border-color: #ffcc66;
            background: #8b5a2b;
        }

        .study-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 36px;
        }

        .study-checkbox {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #f4ebd9;
            font-size: 12px;
        }

        .study-checkbox input {
            width: 17px;
            height: 17px;
            accent-color: #d5a13f;
        }

        .study-speed {
            width: 100%;
            accent-color: #d5a13f;
        }

        .study-select {
            width: 100%;
            min-height: 36px;
            border: 1px solid #634e3d;
            border-radius: 3px;
            background: #1a1512;
            color: #f4ebd9;
            padding: 7px 9px;
            font-family: monospace;
            font-size: 12px;
        }

        .study-select:focus {
            outline: none;
            border-color: #ffcc66;
        }

        .side-motion-sheet {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-top: 18px;
        }

        .side-frame {
            display: grid;
            grid-template-rows: auto 22px;
            place-items: center;
            min-width: 0;
            padding: 7px;
            border: 1px solid #4a3c31;
            border-radius: 4px;
            background: #1a1512;
        }

        .side-frame[aria-current="true"] {
            border-color: #ffcc66;
        }

        .side-frame canvas {
            display: block;
            width: min(100%, 96px);
            height: auto;
            aspect-ratio: 1;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .side-frame span {
            align-self: end;
            color: #bbaaa0;
            font-size: 10px;
        }

        @media (max-width: 760px) {
            body {
                padding: 22px 14px;
            }

            .side-study-layout {
                grid-template-columns: 1fr;
            }

            .side-study-controls {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 520px) {
            .side-study-stages,
            .side-study-controls {
                grid-template-columns: 1fr;
            }

            .side-motion-sheet {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>

    <h1>🛠️ Procedural Matrix Inspector</h1>

    <div style="text-align: center; margin-bottom: 20px;">
        <div id="char-creation-screen" style="display:none;"></div>
        <canvas id="menuCharacterCanvas" style="display:none;"></canvas>
        <canvas id="tester-canvas" width="32" height="32"></canvas>
    </div>

    <section class="panel side-study" aria-labelledby="side-study-title">
        <h2 class="section-title" id="side-study-title" style="color: #ffcc66;">Side Animation Study</h2>
        <div class="side-study-layout">
            <div class="side-study-stages">
                <div class="side-study-stage">
                    <div class="side-study-canvas-wrap">
                        <canvas
                            class="side-study-canvas"
                            id="side-study-male"
                            width="32"
                            height="32"
                            aria-label="Male side-facing animation study"
                        ></canvas>
                    </div>
                    <div class="side-study-stage-label">
                        <strong>Male</strong>
                        <span id="side-study-male-frame">Frame 1/4</span>
                    </div>
                </div>
                <div class="side-study-stage">
                    <div class="side-study-canvas-wrap">
                        <canvas
                            class="side-study-canvas"
                            id="side-study-female"
                            width="32"
                            height="32"
                            aria-label="Female side-facing animation study"
                        ></canvas>
                    </div>
                    <div class="side-study-stage-label">
                        <strong>Female</strong>
                        <span id="side-study-female-frame">Frame 1/4</span>
                    </div>
                </div>
            </div>

            <div class="side-study-controls">
                <div>
                    <label class="study-control-label" for="side-study-hair">Hair Style</label>
                    <select class="study-select" id="side-study-hair"></select>
                </div>

                <div>
                    <span class="study-control-label">Motion</span>
                    <div class="study-segment clips" id="side-study-clips">
                        <button type="button" data-side-clip="idle">Idle</button>
                        <button type="button" data-side-clip="walk">Walk</button>
                        <button type="button" data-side-clip="slash">Sword</button>
                        <button type="button" data-side-clip="bash">Mace</button>
                        <button type="button" data-side-clip="shoot">Bow</button>
                        <button type="button" data-side-clip="cast">Cast</button>
                    </div>
                </div>

                <div>
                    <span class="study-control-label">Facing</span>
                    <div class="study-segment" id="side-study-facing">
                        <button type="button" data-side-facing="right">Right</button>
                        <button type="button" data-side-facing="left">Left</button>
                    </div>
                </div>

                <div>
                    <span class="study-control-label">Motion Sheet</span>
                    <div class="study-segment" id="side-study-sheet-gender">
                        <button type="button" data-side-gender="male">Male</button>
                        <button type="button" data-side-gender="female">Female</button>
                    </div>
                </div>

                <div>
                    <label class="study-control-label" for="side-study-speed">Playback Speed</label>
                    <input
                        class="study-speed"
                        id="side-study-speed"
                        type="range"
                        min="0.5"
                        max="1.75"
                        step="0.25"
                        value="1"
                    >
                </div>

                <div class="study-toggle-row">
                    <label class="study-checkbox">
                        <input id="side-study-anchors" type="checkbox">
                        Anchors
                    </label>
                    <button type="button" id="side-study-playback">Pause</button>
                </div>
            </div>
        </div>
        <div class="side-motion-sheet" id="side-motion-sheet"></div>
    </section>

    <div class="panel" style="max-width: 900px; margin: 0 auto 20px auto;">
        <div class="section-title" style="color: #f1c40f;">🧍 Box 1: Character & Equipment</div>
        
        <div class="grid">
            <button onclick="testerCycle('gender')">Gender</button>
            <button onclick="testerCycle('skin')">Skin Tone</button>
            <button onclick="testerCycle('hair')">Hair Style</button>
            <button onclick="testerCycle('hairColor')">Hair Color</button>
            <button onclick="testerCycle('eyes')">Eye Color</button>
            <button onclick="testerCycle('shirtColor')">Shirt Color</button>
            <button onclick="testerCycle('pantsColor')">Pants Color</button>
            <button onclick="testerCycle('bootsColor')">Base Boots Color</button>
        </div>

        <div class="grid" style="grid-template-columns: repeat(5, 1fr); margin-bottom: 0;">
            <select class="equip-drop" id="select-helmet" onchange="testerEquip('helmet', this.value)">
                <option value="none">-- No Helmet --</option>
            </select>
            <select class="equip-drop" id="select-armor" onchange="testerEquip('armor', this.value)">
                <option value="none">-- No Armor --</option>
            </select>
            <select class="equip-drop" id="select-weapon" onchange="testerEquip('weapon', this.value)">
                <option value="none">-- No Weapon --</option>
            </select>
            <select class="equip-drop" id="select-gloves" onchange="testerEquip('gloves', this.value)">
                <option value="none">-- No Gloves --</option>
            </select>
            <select class="equip-drop" id="select-boots" onchange="testerEquip('boots', this.value)">
                <option value="none">-- No Boots --</option>
            </select>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; max-width: 900px; margin: 0 auto;">
        
        <div class="panel" style="margin: 0; padding: 15px;">
            <div class="section-title" style="color: #2ecc71;">🗺️ Box 2: Map Tiles</div>
            <select id="map-selector" class="asset-listbox" size="10" onchange="previewStandalone('map-selector')"></select>
        </div>

        <div class="panel" style="margin: 0; padding: 15px;">
            <div class="section-title" style="color: #e74c3c;">👾 Box 3: NPCs</div>
            <select id="npc-selector" class="asset-listbox" size="10" onchange="previewStandalone('npc-selector')"></select>
        </div>

        <div class="panel" style="margin: 0; padding: 15px;">
            <div class="section-title" style="color: #3498db;">🎒 Box 4: UI Icons</div>
            <select id="icon-selector" class="asset-listbox" size="10" onchange="previewStandalone('icon-selector')"></select>
        </div>

    </div>

    <script>
        // Mock Player Object
        var player = {
            appearance: {
                gender: 'male', skin: 'light', hair: 'hair_messy',
                hairColor: 'brown', eyes: 'eyes_blue', shirtColor: 'blue',
                pantsColor: 'dark', bootsColor: 'leather'
            },
            equipment: { helmet: null, armor: null, weapon: null, gloves: null, boots: null }
        };
    </script>

    <script src="js/character-creator.js?v=6"></script>
    <script src="js/items.js"></script>
    <script src="js/item-assets.js?v=2"></script>
    <script src="js/icon-assets.js?v=2"></script>
    <script src="js/npc-assets.js?v=2"></script>
    <script src="js/map-assets.js?v=2"></script>
    <script src="js/sprite-overhaul.js?v=17"></script>
    <script src="js/sprite-overhaul-animation.js?v=26"></script>
    <script src="js/sprite-overhaul-equipment.js?v=38"></script>
    <script src="js/sprite-overhaul-world.js?v=1"></script>
    <script src="js/sprite-overhaul-icons.js?v=2"></script>

   <script>
        const TESTER_GRID_SIZE = typeof PROCEDURAL_SPRITE_GRID_SIZE === 'number'
            ? PROCEDURAL_SPRITE_GRID_SIZE
            : 32;
        const TESTER_PREVIEW_SIZE = TESTER_GRID_SIZE * 8;
        const SIDE_STUDY_PREVIEW_SIZE = SIDE_PLAYER_ANIMATION_SIZE * 7;
        const SIDE_MOTION_PREVIEW_SIZE = SIDE_PLAYER_ANIMATION_SIZE * 3;
        const testerCanvas = document.getElementById('tester-canvas');
        testerCanvas.width = TESTER_PREVIEW_SIZE;
        testerCanvas.height = TESTER_PREVIEW_SIZE;

        const sideStudyState = {
            clipId: 'walk',
            facing: 'right',
            sheetGender: 'male',
            frameIndex: 0,
            playing: true,
            speed: 1,
            showAnchors: false,
            lastTimestamp: 0,
            frameAccumulator: 0
        };
        const sideStudyCanvases = {
            male: document.getElementById('side-study-male'),
            female: document.getElementById('side-study-female')
        };
        Object.values(sideStudyCanvases).forEach(canvas => {
            canvas.width = SIDE_STUDY_PREVIEW_SIZE;
            canvas.height = SIDE_STUDY_PREVIEW_SIZE;
        });
        const sideMotionSheet = document.getElementById('side-motion-sheet');
        let sideMotionFrames = [];

        function setSideStudyPlaying(playing) {
            sideStudyState.playing = playing;
            sideStudyState.frameAccumulator = 0;
            document.getElementById('side-study-playback').textContent = playing
                ? 'Pause'
                : 'Play';
        }

        function buildSideMotionSheet() {
            const clip = SidePlayerAnimationClips[sideStudyState.clipId];
            sideMotionSheet.replaceChildren();
            sideMotionFrames = clip.frames.map((poseId, frameIndex) => {
                const button = document.createElement('button');
                const canvas = document.createElement('canvas');
                const label = document.createElement('span');

                button.type = 'button';
                button.className = 'side-frame';
                button.dataset.frameIndex = String(frameIndex);
                button.setAttribute('aria-label', `${clip.label} frame ${frameIndex + 1}`);
                canvas.width = SIDE_MOTION_PREVIEW_SIZE;
                canvas.height = SIDE_MOTION_PREVIEW_SIZE;
                label.textContent = `${frameIndex + 1}. ${poseId.replace(`${sideStudyState.clipId}_`, '')}`;
                button.append(canvas, label);
                button.addEventListener('click', () => {
                    sideStudyState.frameIndex = frameIndex;
                    setSideStudyPlaying(false);
                    renderSideStudy();
                });
                sideMotionSheet.appendChild(button);

                return { button, canvas };
            });
        }

        function drawSideStudyCanvas(canvas, gender, frameIndex) {
            const context = canvas.getContext('2d', { alpha: true });
            context.clearRect(0, 0, canvas.width, canvas.height);
            drawSidePlayerAnimationFrame(
                context,
                gender,
                sideStudyState.clipId,
                frameIndex,
                canvas.width,
                {
                    facing: sideStudyState.facing,
                    showAnchors: sideStudyState.showAnchors,
                    hairStyle: player.appearance.hair,
                    helmetItem: player.equipment.helmet || null,
                    armorItem: player.equipment.armor || null,
                    gloveItem: player.equipment.gloves || null,
                    bootItem: player.equipment.boots || null,
                    weaponItem: player.equipment.weapon || null
                }
            );
        }

        function renderSideStudy() {
            const clip = SidePlayerAnimationClips[sideStudyState.clipId];
            sideStudyState.frameIndex %= clip.frames.length;

            drawSideStudyCanvas(
                sideStudyCanvases.male,
                'male',
                sideStudyState.frameIndex
            );
            drawSideStudyCanvas(
                sideStudyCanvases.female,
                'female',
                sideStudyState.frameIndex
            );

            const frameLabel = `Frame ${sideStudyState.frameIndex + 1}/${clip.frames.length}`;
            document.getElementById('side-study-male-frame').textContent = frameLabel;
            document.getElementById('side-study-female-frame').textContent = frameLabel;

            document.querySelectorAll('[data-side-clip]').forEach(button => {
                button.setAttribute(
                    'aria-pressed',
                    String(button.dataset.sideClip === sideStudyState.clipId)
                );
            });
            document.querySelectorAll('[data-side-facing]').forEach(button => {
                button.setAttribute(
                    'aria-pressed',
                    String(button.dataset.sideFacing === sideStudyState.facing)
                );
            });
            document.querySelectorAll('[data-side-gender]').forEach(button => {
                button.setAttribute(
                    'aria-pressed',
                    String(button.dataset.sideGender === sideStudyState.sheetGender)
                );
            });

            sideMotionFrames.forEach(({ button, canvas }, frameIndex) => {
                drawSideStudyCanvas(canvas, sideStudyState.sheetGender, frameIndex);
                button.setAttribute(
                    'aria-current',
                    String(frameIndex === sideStudyState.frameIndex)
                );
            });
        }

        function initializeSideStudy() {
            buildSideMotionSheet();

            const hairSelect = document.getElementById('side-study-hair');
            CorePlayerHairStyleOptions.forEach(option => {
                const hairOption = document.createElement('option');
                hairOption.value = option.runtimeId;
                hairOption.textContent = option.label;
                hairSelect.appendChild(hairOption);
            });
            hairSelect.value = player.appearance.hair;
            hairSelect.addEventListener('change', event => {
                player.appearance.hair = event.target.value;
                renderSideStudy();
                renderPreview();
            });

            document.getElementById('side-study-clips').addEventListener('click', event => {
                const button = event.target.closest('[data-side-clip]');
                if (!button) return;
                sideStudyState.clipId = button.dataset.sideClip;
                sideStudyState.frameIndex = 0;
                sideStudyState.frameAccumulator = 0;
                buildSideMotionSheet();
                renderSideStudy();
            });

            document.getElementById('side-study-facing').addEventListener('click', event => {
                const button = event.target.closest('[data-side-facing]');
                if (!button) return;
                sideStudyState.facing = button.dataset.sideFacing;
                renderSideStudy();
            });

            document.getElementById('side-study-sheet-gender').addEventListener('click', event => {
                const button = event.target.closest('[data-side-gender]');
                if (!button) return;
                sideStudyState.sheetGender = button.dataset.sideGender;
                renderSideStudy();
            });

            document.getElementById('side-study-speed').addEventListener('input', event => {
                sideStudyState.speed = Number(event.target.value) || 1;
                sideStudyState.frameAccumulator = 0;
            });

            document.getElementById('side-study-anchors').addEventListener('change', event => {
                sideStudyState.showAnchors = event.target.checked;
                renderSideStudy();
            });

            document.getElementById('side-study-playback').addEventListener('click', () => {
                setSideStudyPlaying(!sideStudyState.playing);
                renderSideStudy();
            });

            renderSideStudy();
            requestAnimationFrame(updateSideStudy);
        }

        function updateSideStudy(timestamp) {
            if (!sideStudyState.lastTimestamp) sideStudyState.lastTimestamp = timestamp;
            const elapsed = Math.min(100, timestamp - sideStudyState.lastTimestamp);
            sideStudyState.lastTimestamp = timestamp;

            if (sideStudyState.playing) {
                const clip = SidePlayerAnimationClips[sideStudyState.clipId];
                const frameDuration = 1000 / (clip.fps * sideStudyState.speed);
                sideStudyState.frameAccumulator += elapsed;

                if (sideStudyState.frameAccumulator >= frameDuration) {
                    sideStudyState.frameAccumulator %= frameDuration;
                    sideStudyState.frameIndex = (
                        sideStudyState.frameIndex + 1
                    ) % clip.frames.length;
                    renderSideStudy();
                }
            }

            requestAnimationFrame(updateSideStudy);
        }

        // === 1. POPULATE BOX 1 (EQUIPMENT) ===
        function initializeInventoryUI() {
            const gearSlots = ['helmet', 'armor', 'weapon', 'gloves', 'boots'];
            const availableGear = { helmet: [], armor: [], weapon: [], gloves: [], boots: [] };

            for (let key in ItemDatabase) {
                let item = ItemDatabase[key];
                if (availableGear[item.slot]) availableGear[item.slot].push(item);
            }

            gearSlots.forEach(slot => {
                let select = document.getElementById(`select-${slot}`);
                availableGear[slot].forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item.id; opt.innerText = item.name;
                    select.appendChild(opt);
                });
            });
        }

        // === 2. AUTO-SORT & POPULATE BOXES 2, 3, 4 ===
        function initializeAssetBoxes() {
            let mapSel = document.getElementById("map-selector");
            let npcSel = document.getElementById("npc-selector");
            let iconSel = document.getElementById("icon-selector");

            setTimeout(() => {
                if (typeof SpriteMatrices !== 'undefined') {
                    
                    let equipmentSprites = new Set();
                    if (typeof ItemDatabase !== 'undefined') {
                        for (let key in ItemDatabase) {
                            let sId = ItemDatabase[key].spriteId;
                            if (sId) {
                                equipmentSprites.add(sId);
                                equipmentSprites.add(sId + '_male'); 
                                equipmentSprites.add(sId + '_female');
                            }
                        }
                    }

                    Object.keys(SpriteMatrices).sort().forEach(key => {
                        let opt = document.createElement("option");
                        opt.value = key; opt.text = key;

                        if (key.startsWith('icon_')) {
                            iconSel.appendChild(opt);
                        } else if (key.match(/^(map_|ground_|wall_|obj_)/)) {
                            mapSel.appendChild(opt);
                        } else if (key.match(/^(body_|hair_|eyes_)/) || equipmentSprites.has(key)) {
                            return; 
                        } else {
                            npcSel.appendChild(opt);
                        }
                    });
                }
            }, 100);
        }

        // === 3. STANDALONE RENDER CONTROLLER ===
        function resetStandaloneSelectors() {
            document.getElementById("map-selector").selectedIndex = -1;
            document.getElementById("npc-selector").selectedIndex = -1;
            document.getElementById("icon-selector").selectedIndex = -1;
        }

        function previewStandalone(activeSelectorId) {
            const selectors = ['map-selector', 'npc-selector', 'icon-selector'];
            selectors.forEach(id => {
                if (id !== activeSelectorId) document.getElementById(id).selectedIndex = -1;
            });

            let selected = document.getElementById(activeSelectorId).value;
            const canvas = document.getElementById('tester-canvas');
            const ctx = canvas.getContext('2d');
            const spriteSize = canvas.width;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let originalB = PALETTE['b'];
            if (activeSelectorId === 'npc-selector') {
                PALETTE['b'] = '#5d4037'; // Boar Brown
            } else {
                PALETTE['b'] = '#f4ebd9'; // Bone White
            }

            if (selected && SpriteMatrices[selected]) {
                drawProceduralSprite(ctx, SpriteMatrices[selected], 0, 0, spriteSize);
            } else {
                renderPreview(); 
            }

            PALETTE['b'] = originalB;
        }

        // === 4. PAPERDOLL EVENT TRIGGERS ===
        function testerEquip(slot, itemId) {
            resetStandaloneSelectors(); 
            if (itemId === "none") player.equipment[slot] = null;
            else player.equipment[slot] = ItemDatabase[itemId];
            renderSideStudy();
            renderPreview();
        }

        function testerCycle(part) {
            resetStandaloneSelectors(); 
            let currentIdx = appearanceOptions[part].indexOf(player.appearance[part]);
            let nextIdx = (currentIdx + 1) % appearanceOptions[part].length;
            player.appearance[part] = appearanceOptions[part][nextIdx];
            if (part === 'hair') {
                document.getElementById('side-study-hair').value = player.appearance.hair;
            }
            renderSideStudy();
            renderPreview();
        }

        // === 5. UPGRADED PAPERDOLL RENDERER (WITH MASK BUFFER) ===
        function renderPreview() {
            const canvas = document.getElementById('tester-canvas');
            const ctx = canvas.getContext('2d');
            const spriteSize = canvas.width;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let originalB = PALETTE['b'];
            PALETTE['b'] = '#f4ebd9';

            // === NEW: OFFSCREEN COMPOSITE BUFFER ===
            // This safely catches the clearRect masking logic without punching through the HTML background
            const bufferCanvas = document.createElement('canvas');
            bufferCanvas.width = canvas.width;
            bufferCanvas.height = canvas.height;
            const bufferCtx = bufferCanvas.getContext('2d', { alpha: true });

            let bodySprite = player.appearance.gender === 'female' ? 'body_female' : 'body_male';
            if (SpriteMatrices[bodySprite]) drawProceduralSprite(bufferCtx, SpriteMatrices[bodySprite], 0, 0, spriteSize);
            if (SpriteMatrices[player.appearance.eyes]) drawProceduralSprite(bufferCtx, SpriteMatrices[player.appearance.eyes], 0, 0, spriteSize);
            
            const hidesHair = player.equipment.helmet && player.equipment.helmet.hidesHair;
            if (!hidesHair && SpriteMatrices[player.appearance.hair]) {
                drawProceduralSprite(bufferCtx, SpriteMatrices[player.appearance.hair], 0, 0, spriteSize);
            }

            const eq = player.equipment;
            let gSuffix = player.appearance.gender === 'female' ? '_female' : '_male';
            
            if (eq.armor && eq.armor.spriteId) {
                let sId = eq.armor.spriteId + gSuffix;
                if (SpriteMatrices[sId]) drawProceduralSprite(bufferCtx, SpriteMatrices[sId], 0, 0, spriteSize);
                else if (SpriteMatrices[eq.armor.spriteId]) drawProceduralSprite(bufferCtx, SpriteMatrices[eq.armor.spriteId], 0, 0, spriteSize);
            }
            
            if (eq.boots && eq.boots.spriteId) drawProceduralSprite(bufferCtx, SpriteMatrices[eq.boots.spriteId], 0, 0, spriteSize);
            if (eq.gloves && eq.gloves.spriteId) drawProceduralSprite(bufferCtx, SpriteMatrices[eq.gloves.spriteId], 0, 0, spriteSize);
            
            // The helmet is drawn last onto the buffer, applying any `_` masking pixels to the hair layer beneath it
            if (eq.helmet && eq.helmet.spriteId) drawProceduralSprite(bufferCtx, SpriteMatrices[eq.helmet.spriteId], 0, 0, spriteSize);
            
            // STAMP THE FULLY COMPOSITED CHARACTER ONTO THE MAIN CANVAS
            ctx.drawImage(bufferCanvas, 0, 0);

            // The weapon is drawn onto the main canvas AFTER the buffer so it retains its own independent scaling and rotation
            if (eq.weapon && eq.weapon.spriteId) {
                if (typeof drawFrontPaperdollWeapon === 'function') {
                    drawFrontPaperdollWeapon(
                        ctx,
                        eq.weapon.spriteId,
                        0,
                        0,
                        spriteSize,
                        {
                            scaleMultiplier:
                                eq.weapon.oversizeScale || 1
                        }
                    );
                } else if (SpriteMatrices[eq.weapon.spriteId]) {
                    drawProceduralSprite(
                        ctx,
                        SpriteMatrices[eq.weapon.spriteId],
                        0,
                        0,
                        spriteSize
                    );
                }
            }

            PALETTE['b'] = originalB;
        }

        // === 6. BOOT INITIALIZATION ===
        window.addEventListener('load', () => {
            initializeSideStudy();
            initializeInventoryUI();
            initializeAssetBoxes();
            renderPreview();
        });
    </script>
</body>
</html>
